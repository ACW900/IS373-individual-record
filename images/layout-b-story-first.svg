  <circle cx="98" cy="160" r="46" fill="#e5e7eb" stroke="#c9ced6"/>
  <circle cx="98" cy="146" r="15" fill="#cbd5e1"/>
  <path d="M70 190 Q98 160 126 190" fill="#cbd5e1"/>
  <text x="98" y="222" font-size="9" fill="#9ca3af" text-anchor="middle">photo</text>
  <text x="168" y="124" font-size="17" font-weight="700" fill="#111827">Hi, I'm Alex.</text>
  <text x="168" y="144" font-size="10.5" fill="#4b5563">NJIT IT student, ShopRite cashier since 2022, and how I</text>
  <text x="168" y="159" font-size="10.5" fill="#4b5563">went from a Raspberry Pi network to CI/CD pipelines</text>
  <text x="168" y="174" font-size="10.5" fill="#4b5563">and AI apps...</text>
  <rect x="168" y="186" width="400" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="168" y="198" width="380" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="168" y="210" width="300" height="6" rx="3" fill="#e5e7eb"/>

  <!-- timeline -->
  <text x="44" y="262" font-size="11" font-weight="700" fill="#374151" letter-spacing="1">MY JOURNEY</text>
  <line x1="64" y1="296" x2="580" y2="296" stroke="#c9ced6" stroke-width="2"/>
  <g font-size="9.5" fill="#374151" text-anchor="middle">
    <circle cx="80" cy="296" r="7" fill="#6b7280"/><text x="80" y="318">2024</text><text x="80" y="331">Raspberry Pi</text>
    <circle cx="200" cy="296" r="7" fill="#6b7280"/><text x="200" y="318">Spring 2025</text><text x="200" y="331">First website</text>
    <circle cx="320" cy="296" r="7" fill="#6b7280"/><text x="320" y="318">Spring 2026</text><text x="320" y="331">GameAtlas</text>
    <circle cx="440" cy="296" r="7" fill="#6b7280"/><text x="440" y="318">Fall 2026</text><text x="440" y="331">CI/CD pipeline</text>
    <circle cx="560" cy="296" r="7" fill="#1f6feb"/><text x="560" y="318">Now</text><text x="560" y="331">RAG app</text>
  </g>

  <!-- projects lower -->
  <text x="44" y="372" font-size="11" font-weight="700" fill="#374151" letter-spacing="1">PROJECTS</text>
  <g>
    <rect x="44" y="384" width="172" height="52" rx="6" fill="#fff" stroke="#c9ced6"/>
