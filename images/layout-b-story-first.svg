<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <title>Layout B: story-first portfolio homepage wireframe</title>
  <rect x="0" y="0" width="640" height="520" rx="14" fill="#f6f7f9"/>
  <rect x="20" y="20" width="600" height="480" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <rect x="20" y="20" width="600" height="28" rx="10" fill="#eceff3"/>
  <rect x="20" y="38" width="600" height="10" fill="#eceff3"/>
  <circle cx="38" cy="34" r="4.5" fill="#e06c6c"/><circle cx="52" cy="34" r="4.5" fill="#e5b94e"/><circle cx="66" cy="34" r="4.5" fill="#6cc070"/>
  <rect x="90" y="27" width="300" height="14" rx="7" fill="#ffffff" stroke="#d6dae0"/>
  <text x="100" y="38" font-size="9" fill="#6b7280">acw33firstliveproj.online</text>

  <!-- nav -->
  <text x="44" y="78" font-size="15" font-weight="700" fill="#1f2937">Alex Wiemer</text>
